
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Brew & Bloom</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <section class="reservation-section">
        <div class="reservation-container">
            <h2>Reset Your Password</h2>
            <p>Enter your new admin password below.</p>

            <form id="reset-form">
                <input
                    type="password"
                    id="new-password"
                    placeholder="New password"
                    minlength="8"
                    required
                >

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm new password"
                    minlength="8"
                    required
                >

                <button type="submit" id="reset-button">
                    Update Password
                </button>

                <p id="reset-message"></p>
            </form>
        </div>
    </section>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>

    <script>
        const resetForm = document.getElementById("reset-form");
        const resetMessage = document.getElementById("reset-message");

        resetForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const password = document.getElementById("new-password").value;
            const confirmPassword = document.getElementById("confirm-password").value;

            if (password.length < 8) {
                resetMessage.textContent = "Password must contain at least 8 characters.";
                return;
            }

            if (password !== confirmPassword) {
                resetMessage.textContent = "Passwords do not match.";
                return;
            }

            const button = document.getElementById("reset-button");
            button.disabled = true;
            button.textContent = "Updating...";

            try {
                const { error } = await supabaseClient.auth.updateUser({
                    password: password
                });

                if (error) throw error;

                resetMessage.textContent = "Password updated successfully! You can now log in.";

                resetForm.reset();

            } catch (error) {
                console.error(error);
                resetMessage.textContent = error.message;
            } finally {
                button.disabled = false;
                button.textContent = "Update Password";
            }
        });
    </script>

</body>
</html>
